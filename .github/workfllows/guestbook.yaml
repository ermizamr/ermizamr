# Credit to https://github.com/openscript/openscript :)

name: Guestbook

on:
  issue_comment:
    types: [created, edited, deleted]

jobs:
  update_guestbook:
    name: Update guestbook
    if: ${{ github.event.issue.title == 'Guestbook' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Update guestbook from comments
        uses: actions/github-script@v6
        with:
          script: |
            const truncateString = (str, num) => str.length > num ? str.slice(0, num) + "..." : str;

            const query = `query($owner:String!, $name:String!, $issue_number:Int!) {
              repository(owner:$owner, name:$name){
                issue(number:$issue_number) {
                  comments(first:20,orderBy:{direction:DESC, field:UPDATED_AT}) {
                    nodes {
                      author {
                        avatarUrl(size: 24)
                        login
                        url
                      }
                      bodyText
                      updatedAt
                    }
                  }
                }
              }
            }`;
            const variables = {
              owner: context.repo.owner,
              name: context.repo.repo,
              issue_number: context.issue.number
            }
            
            const result = await github.graphql(query, variables)
            const renderComments = (comments) => {
              return comments.reduce((prev, curr) => {
                let text = curr.bodyText.replace(/(\r\n|\r|\n)/g, "<br />").replace(/\|/g, '&#124;');
                text = truncateString(text, 125);
                return `${prev}| <a href="${curr.author.url}"><img width="24" src="${curr.author.avatarUrl}" alt="${curr.author.login}" /> ${curr.author.login}</a> | ${new Date(curr.updatedAt).toLocaleString()} | ${text} |\n`;
              }, "| Name | Date | Message |\n|---|---|---|\n");
            };

            const fileSystem = require('fs');
            const readme = fileSystem.readFileSync('README.md', 'utf8');
            // Replace only content between guestbook markers:
            const newGuestbook = renderComments(result.repository.issue.comments.nodes);
            const newReadme = readme.replace(/(?<=<!-- Guestbook -->\n)[\s\S]*?(?=<!-- \/Guestbook -->|$)/m, newGuestbook);
            fileSystem.writeFileSync('README.md', newReadme, 'utf8');

      - name: Commit and push guestbook update
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m ':sparkles: update guestbook' || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
